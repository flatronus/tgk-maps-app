    var sentence = STORAGE.sentences[selection.sentenceIndex];
    if (!sentence) return false;
    if (sentence.root.id === selection.nodeId) return true;
    return !!findParent(sentence.root, selection.nodeId);
  }

  // Показує модальне вікно підтвердження з кнопками «Ок»/«Ні».
  var pendingConfirmAction = null;
  function showConfirm(message, onOk) {
    confirmMessage.textContent = message;
    pendingConfirmAction = onOk;
    confirmModal.classList.remove('hidden');
  }
  function hideConfirm() {
    confirmModal.classList.add('hidden');
    pendingConfirmAction = null;
  }

  function setCurrentLineType(lineType) {
    currentLineType = lineType;
    lineStyleButtons.forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-line-type') === lineType);
    });

    if (selection.type === 'edge') {
      var sentence = STORAGE.sentences[selection.sentenceIndex];
      var edge = sentence ? findEdge(sentence.root, selection.parentId, selection.childId) : null;
      if (edge) {
        edge.lineType = lineType;
        renderAll();
      }
    }
  }

  function updateTargetIndicator() {
    deleteSentenceBtn.disabled = (selection.type === null);
    editSentenceBtn.disabled = (selection.type !== 'node' && selection.type !== 'group');
    editSentenceBtn.classList.toggle('active', !!((editingTarget && selection.type === 'node' &&
      editingTarget.sentenceIndex === selection.sentenceIndex && editingTarget.nodeId === selection.nodeId) ||
      (groupTitleEdit && selection.type === 'group' &&
      groupTitleEdit.sentenceIndex === selection.sentenceIndex && groupTitleEdit.groupId === selection.groupId)));
    frameBtn.disabled = !canGroupSelectedNode();
    frameBtn.classList.toggle('active', selection.type === 'group');

    if (selection.type === 'node') {
      var sentence = STORAGE.sentences[selection.sentenceIndex];
      var node = sentence ? findNode(sentence.root, selection.nodeId) : null;
      if (!node) { clearSelection(); return; }
      targetLabel.textContent = '«' + node.text + '»';
      return;
    }
    if (selection.type === 'edge') {
      var edgeSentence = STORAGE.sentences[selection.sentenceIndex];
      var parent = edgeSentence ? findNode(edgeSentence.root, selection.parentId) : null;
      var edgeObj = edgeSentence ? findEdge(edgeSentence.root, selection.parentId, selection.childId) : null;
      if (!parent || !edgeObj) { clearSelection(); return; }
      targetLabel.textContent = 'лінія «' + parent.text + '» → «' + edgeObj.node.text + '»';
      return;
    }
    if (selection.type === 'group') {
      targetLabel.textContent = 'рамка групування («✏» — заголовок, «+» — прямокутник праворуч)';
      return;
    }
    targetLabel.textContent = 'новий термін';
  }

  function renderAll() {
    if (selection.type === 'group' && !STORAGE.sentences[selection.sentenceIndex]) {
      selection.type = null;
      selection.sentenceIndex = null;
      selection.groupId = null;
    }

    list.innerHTML = '';
    emptyState.style.display = STORAGE.sentences.length === 0 ? 'block' : 'none';

    STORAGE.sentences.forEach(function (sentence, index) {
      sentence.groups = sentence.groups || [];

      var row = document.createElement('div');
      row.className = 'sentence-row';

      var label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = String(index + 1).padStart(2, '0');

      var diagramHolder = document.createElement('div');
      diagramHolder.className = 'row-diagram';
      diagramHolder.appendChild(buildDiagram(sentence, index));

      row.appendChild(label);
      row.appendChild(diagramHolder);
      list.appendChild(row);
    });

    countLabel.textContent = 'Речень додано: ' + STORAGE.sentences.length;
    updateTargetIndicator();
  }

  function addBox() {
    var value = input.value.trim();
    if (!value) return;

    if (selection.type === 'edge') {
      // На вибраній лінії новий прямокутник не додається — лінія використовується
      // лише для заміни її типу через ряд іконок нижче.
      return;
    }

    if (selection.type === 'group') {
      var groupSentence = STORAGE.sentences[selection.sentenceIndex];
      var group = groupSentence ? (groupSentence.groups || []).filter(function (g) { return g.id === selection.groupId; })[0] : null;
      if (!group) { clearSelection(); input.value = ''; return; }

      // Якщо кнопкою «✏» увімкнено редагування заголовка рамки — «Додати»
      // зберігає введений текст як заголовок, новий прямокутник не створюється.
      if (groupTitleEdit && groupTitleEdit.sentenceIndex === selection.sentenceIndex && groupTitleEdit.groupId === selection.groupId) {
        group.title = value;
        groupTitleEdit = null;
        input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
        input.value = '';
        renderAll();
        input.focus();
        return;
      }

      // Інакше «Додати» створює новий прямокутник ЗОВНІ рамки, праворуч,
      // з'єднаний лінією від самої рамки (як прямокутник з прямокутником).
      // Технічно новий прямокутник додається як дочірній до останнього
      // прямокутника всередині рамки (щоб коректно потрапити у наступну
      // колонку розкладки), а edge.frameGroupId вказує, що лінію при
      // відображенні треба малювати від краю рамки, а не від цього вузла.
      var anchorId = group.nodeIds[group.nodeIds.length - 1];
      var anchorNode = anchorId != null ? findNode(groupSentence.root, anchorId) : null;
      if (!anchorNode) { clearSelection(); input.value = ''; return; }
      var newFrameChild = createNode(value);
      anchorNode.children.push({ node: newFrameChild, lineType: currentLineType, frameGroupId: group.id });

      input.value = '';
      renderAll();
      input.focus();
      return;
    }

    if (selection.type !== 'node') {
      // Немає вибраного прямокутника — створюємо нове графічне речення (корінь).
      var root = createNode(value);
      STORAGE.sentences.push({ root: root, groups: [] });
    } else {
      var sentence = STORAGE.sentences[selection.sentenceIndex];
      var targetNode = sentence ? findNode(sentence.root, selection.nodeId) : null;
      if (!targetNode) {
        clearSelection();
        input.value = '';
        return;
      }
      var childNode = createNode(value);
      targetNode.children.push({ node: childNode, lineType: currentLineType });
    }

    input.value = '';
    renderAll();
    input.focus();
  }

  function addClarifyingLine() {
    var value = input.value.trim();
    if (!value) return;
    if (selection.type !== 'node') return;

    var sentence = STORAGE.sentences[selection.sentenceIndex];
    var targetNode = sentence ? findNode(sentence.root, selection.nodeId) : null;
    if (!targetNode) {
      clearSelection();
      input.value = '';
      return;
    }
    targetNode.notes.push(value);

    input.value = '';
    renderAll();
    input.focus();
  }

  addBtn.addEventListener('click', addBox);
  clarifyBtn.addEventListener('click', addClarifyingLine);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addBox();
  });
  lineStyleButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setCurrentLineType(btn.getAttribute('data-line-type'));
    });
  });

  frameBtn.addEventListener('click', function () {
    if (!canGroupSelectedNode()) return;
    var sentence = STORAGE.sentences[selection.sentenceIndex];
    sentence.groups = sentence.groups || [];
    // Корінь речення не має батька — для нього parentId навмисно null
    // («рамка кореневого рівня»): сама рамка можлива, просто розширити її
    // на сиблінгів нікуди, бо корінь завжди єдиний.
    var isRoot = sentence.root.id === selection.nodeId;
    var parentId = isRoot ? null : findParent(sentence.root, selection.nodeId).parent.id;
    var group = { id: nextGroupId++, parentId: parentId, nodeIds: [selection.nodeId] };
    sentence.groups.push(group);
    selectGroup(selection.sentenceIndex, group.id);
  });


  // Перемикає режим редагування тексту вибраного прямокутника (основний
  // текст і уточнюючі рядки перетворюються на поля вводу).
  editSentenceBtn.addEventListener('click', function () {
    if (selection.type === 'group') {
      var isTitleEditing = !!(groupTitleEdit && groupTitleEdit.sentenceIndex === selection.sentenceIndex && groupTitleEdit.groupId === selection.groupId);
      if (isTitleEditing) {
        groupTitleEdit = null;
        input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
        input.value = '';
        renderAll();
        return;
      }
      var titleSentence = STORAGE.sentences[selection.sentenceIndex];
      var titleGroup = titleSentence ? (titleSentence.groups || []).filter(function (g) { return g.id === selection.groupId; })[0] : null;
      groupTitleEdit = { sentenceIndex: selection.sentenceIndex, groupId: selection.groupId };
      input.value = (titleGroup && titleGroup.title) ? titleGroup.title : '';
      input.placeholder = 'Заголовок рамки, тоді «+»…';
      renderAll();
      input.focus();
      input.select();
      return;
    }

    if (selection.type !== 'node') return;
    var isCurrentlyEditing = !!(editingTarget && editingTarget.sentenceIndex === selection.sentenceIndex && editingTarget.nodeId === selection.nodeId);
    if (isCurrentlyEditing) {
      editingTarget = null;
      renderAll();
      return;
    }
    editingTarget = { sentenceIndex: selection.sentenceIndex, nodeId: selection.nodeId };
    renderAll();
    var headerInput = list.querySelector('.node-edit-input:not(.note-edit-input)');
    if (headerInput) { headerInput.focus(); headerInput.select(); }
  });

  // Кнопка видалення працює для будь-якого вибраного елемента: рамки (без
  // видалення прямокутників), прямокутника/лінії (разом з дочірніми
  // прямокутниками), або цілого графічного речення, якщо вибрано корінь.
  deleteSentenceBtn.addEventListener('click', function () {
    if (selection.type === null) return;

    if (selection.type === 'group') {
      var gSentenceIdx = selection.sentenceIndex;
      var gGroupId = selection.groupId;
      showConfirm('Видалити рамку групування? Прямокутники всередині залишаться.', function () {
        var sentence = STORAGE.sentences[gSentenceIdx];
        if (sentence) sentence.groups = (sentence.groups || []).filter(function (g) { return g.id !== gGroupId; });
        clearSelection();
      });
      return;
    }

    var sentenceIdx = selection.sentenceIndex;
    var sentence = STORAGE.sentences[sentenceIdx];
    if (!sentence) return;

    if (selection.type === 'node' && sentence.root.id === selection.nodeId) {
      showConfirm('Видалити графічне речення №' + (sentenceIdx + 1) + '?', function () {
        STORAGE.sentences.splice(sentenceIdx, 1);
        if (selection.sentenceIndex === sentenceIdx) {
          clearSelection();
        } else {
          if (selection.sentenceIndex !== null && selection.sentenceIndex > sentenceIdx) {
            selection.sentenceIndex -= 1;
          }
          renderAll();
        }
      });
      return;
    }

    var targetNodeId = selection.type === 'node' ? selection.nodeId : selection.childId;
    var targetNode = findNode(sentence.root, targetNodeId);
    var label = targetNode ? '«' + targetNode.text + '»' : 'вибраний елемент';
    showConfirm('Видалити ' + label + ' разом з дочірніми прямокутниками?', function () {
      var parentInfo = findParent(sentence.root, targetNodeId);
      if (parentInfo) {
        var removedNode = parentInfo.parent.children[parentInfo.index].node;
        var removedIds = collectSubtreeIds(removedNode);
        parentInfo.parent.children.splice(parentInfo.index, 1);
        sentence.groups = (sentence.groups || []).filter(function (g) {
          g.nodeIds = g.nodeIds.filter(function (id) { return removedIds.indexOf(id) === -1; });
          return g.nodeIds.length > 0 && removedIds.indexOf(g.parentId) === -1;
        });
      }
      clearSelection();
    });
  });

  confirmOkBtn.addEventListener('click', function () {
    var action = pendingConfirmAction;
    hideConfirm();
    if (action) action();
  });
  confirmCancelBtn.addEventListener('click', hideConfirm);

  function setZoom(level) {
    zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, level));
    canvasZoom.style.zoom = zoomLevel;
    zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
  }

  zoomInBtn.addEventListener('click', function () { setZoom(zoomLevel + ZOOM_STEP); });
  zoomOutBtn.addEventListener('click', function () { setZoom(zoomLevel - ZOOM_STEP); });

  setZoom(zoomLevel);
  setCurrentLineType(currentLineType);
  renderAll();
})();

// Реєстрація service worker для роботи застосунку як PWA (офлайн-доступ,
// встановлення на пристрій). Якщо файл відкрито не через http(s) (наприклад,
// напряму з диска через file://), service worker недоступний — це нормально.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('Не вдалося зареєструвати service worker:', err);
    });
  });
}
</script>
</body>
</html>
