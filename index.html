<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Кресленик речень</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2036">
<meta name="description" content="Побудова графічних схем речень: прямокутники-терміни, з'єднані лініями визначень.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кресленик">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blueprint-bg: #16324F;
    --blueprint-bg-deep: #102640;
    --grid-line: rgba(157, 205, 255, 0.08);
    --grid-line-strong: rgba(157, 205, 255, 0.14);
    --ink: #EAF4FF;
    --ink-dim: #9FBEDB;
    --accent: #6FD6C9;
    --accent-dim: rgba(111, 214, 201, 0.35);
    --box-stroke: #CFE8FF;
    --paper-card: #0F2A45;
    --danger: #E0876B;
    --edge-selected: #F4C363;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--blueprint-bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    /* Забороняє «гумовий» відскок/прокрутку самої сторінки на дотикових
       пристроях (iPad/Android) — саме через нього верхня панель могла на
       мить «зникати» з екрана під час прокрутки тла з реченнями, навіть у
       встановленому як PWA застосунку. */
    overscroll-behavior: none;
    /* Тло/канва застосунку не повинно виділятись як текст під час
       перетягування пальцем (напр. маркера рамки): без цього браузер
       конкурує власним жестом «виділення тексту по дотику» з обробкою
       дотику в JS, через що і виділявся весь текст на панелях, і власна
       підсвітка прямокутника під час перетягування не встигала спрацювати.
       Реальні поля вводу (#sentenceInput, .node-edit-input) нижче явно
       повертають собі можливість виділення. */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    display: flex;
    flex-direction: column;
    /* Жорстко прив'язує застосунок до вікна перегляду (а не покладається
       лише на overflow:hidden, який на iOS/iPadOS не завжди повністю
       забороняє прокрутку самої сторінки) — гарантує, що верхня й нижня
       панелі завжди лишаються нерухомими, а прокручується тільки вміст
       усередині .content-scroll. Відступи safe-area потрібні, щоб панелі не
       ховались під «чубчиком»/індикатором в повноекранному PWA-режимі.
    */
    position: fixed;
    inset: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
    background-position: -1px -1px;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 28px;
  }

  .topbar {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--grid-line-strong);
    box-shadow: 0 6px 16px rgba(4, 14, 26, 0.35);
    z-index: 20;
    position: relative;
  }
  .topbar .wrap { padding-top: 22px; padding-bottom: 18px; }

  .content-scroll {
    flex: 1 1 auto;
    overflow: auto;
    position: relative;
    /* Плавна інерційна прокрутка на iOS і заборона «прокидання» жесту прокрутки
       з кінця вмісту на саму сторінку (що й ховало верхню панель). */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .content-scroll .wrap { padding-top: 26px; padding-bottom: 26px; }

  .statusbar {
    flex: 0 0 auto;
    background: var(--paper-card);
    border-top: 1px solid var(--grid-line-strong);
    z-index: 20;
  }
  .statusbar .wrap {
    padding-top: 10px;
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
  }

  header {
    padding: 0;
    margin: 0;
    border-bottom: 1px dashed var(--grid-line-strong);
  }

  .app-version {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 14.5px;
    max-width: 620px;
    line-height: 1.5;
    margin: 0;
  }

  .panel {
    background: var(--paper-card);
    border: 1px solid var(--grid-line-strong);
    border-radius: 4px;
    padding: 16px 20px;
    position: relative;
  }

  .panel::before {
    content: "";
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px dashed var(--grid-line-strong);
    border-radius: 2px;
    pointer-events: none;
  }

  .input-row {
    display: flex;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  #sentenceInput {
    flex: 1;
    background: var(--blueprint-bg-deep);
    border: 1px solid var(--grid-line-strong);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #sentenceInput::placeholder { color: var(--ink-dim); }
  #sentenceInput:focus { border-color: var(--accent); }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 3px;
    border: 1px solid transparent;
    padding: 12px 18px;
    cursor: pointer;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #addBtn, #clarifyBtn, #frameBtn {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #addBtn {
    background: var(--accent);
    color: #0B2036;
    font-weight: 600;
  }
  #addBtn:hover { opacity: 0.88; }

  #clarifyBtn {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  #clarifyBtn:hover { opacity: 0.8; }

  #frameBtn {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent-dim);
    font-size: 17px;
  }
  #frameBtn:hover { opacity: 0.8; }
  #frameBtn.active {
    background: rgba(244, 195, 99, 0.15);
    color: var(--edge-selected);
    border-color: var(--edge-selected);
  }

  .line-style-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }

  .line-style-icons {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .row-delete-top {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 15px;
    background: transparent;
    border: 1px solid var(--grid-line-strong);
    color: var(--ink-dim);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: none;
  }
  .row-delete-top:hover { color: var(--danger); border-color: var(--danger); }
  #editSentenceBtn:hover { color: var(--accent); border-color: var(--accent-dim); }
  #editSentenceBtn.active {
    background: rgba(244, 195, 99, 0.15);
    color: var(--edge-selected);
    border-color: var(--edge-selected);
  }
  #frameBtn:disabled,
  .zoom-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .row-delete-top:disabled { opacity: 0.35; cursor: not-allowed; }
  .row-delete-top:disabled:hover { color: var(--ink-dim); border-color: var(--grid-line-strong); }

  .line-style-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blueprint-bg-deep);
    border: 1px solid var(--grid-line-strong);
    border-radius: 3px;
    color: var(--ink-dim);
    padding: 6px 12px;
    text-transform: none;
  }
  .line-style-btn:hover { color: var(--ink); border-color: var(--ink-dim); }
  .line-style-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(111, 214, 201, 0.08);
  }

  .target-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .target-indicator .target-value {
    color: var(--accent);
  }

  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .zoom-btn {
    width: 24px;
    height: 24px;
    padding: 0;
    font-size: 14px;
    line-height: 1;
    background: transparent;
    border: 1px solid var(--grid-line-strong);
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: none;
  }
  .zoom-btn:hover { color: var(--accent); border-color: var(--accent); }

  #zoomLabel { min-width: 40px; text-align: center; }

  #sentenceList {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .sentence-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--grid-line-strong);
  }
  .sentence-row:last-child { border-bottom: none; }

  .row-label {
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    padding-top: 10px;
    min-width: 52px;
  }

  .row-diagram {
    flex: 1;
    min-width: 0;
    padding-bottom: 4px;
  }

  .row-diagram svg { display: block; }

  .empty-state {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-dim);
    font-size: 13.5px;
    padding: 30px 4px;
    border: 1px dashed var(--grid-line-strong);
    border-radius: 4px;
    text-align: center;
  }

  .word-box {
    fill: var(--blueprint-bg-deep);
    stroke: var(--box-stroke);
    stroke-width: 1.3;
    cursor: pointer;
  }

  .word-box.selected {
    stroke: var(--accent);
    stroke-width: 2.4;
    fill: rgba(111, 214, 201, 0.12);
  }

  .word-text {
    fill: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    dominant-baseline: middle;
    text-anchor: middle;
    cursor: pointer;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .note-text {
    fill: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    dominant-baseline: middle;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .note-divider {
    stroke: var(--grid-line-strong);
    stroke-width: 1;
    pointer-events: none;
  }

  #sentenceInput,
  .node-edit-input {
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }

  .node-edit-input {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    background: rgba(244, 195, 99, 0.1);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    text-align: center;
    padding: 0 4px;
  }
  .node-edit-input.note-edit-input {
    color: var(--ink-dim);
    font-size: 12px;
    background: transparent;
  }

  .link-line {
    stroke: var(--accent);
    fill: none;
    pointer-events: none;
  }

  .link-hit {
    stroke: transparent;
    stroke-width: 14;
    fill: none;
    cursor: pointer;
  }

  .link-line.line-dashed { stroke-width: 1.3; stroke-dasharray: 3 3; }
  .link-line.line-solid { stroke-width: 1.3; }
  .link-line.line-double { stroke-width: 1.3; }

  .link-line.selected {
    stroke: var(--edge-selected);
    stroke-width: 2.6;
    stroke-dasharray: none;
  }

  .group-frame {
    fill: rgba(244, 195, 99, 0.06);
    stroke: var(--accent-dim);
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    pointer-events: none;
  }
  .group-frame.selected {
    stroke: var(--edge-selected);
    fill: rgba(244, 195, 99, 0.1);
  }

  .group-frame.dragging {
    stroke: var(--danger);
  }

  .group-frame.removing {
    opacity: 0.35;
  }

  .group-frame-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14;
    pointer-events: stroke;
    cursor: pointer;
  }

  .frame-handle {
    fill: var(--edge-selected);
    stroke: var(--paper-card);
    stroke-width: 1.5;
    cursor: ns-resize;
    pointer-events: none;
  }
  .frame-handle-hit {
    fill: transparent;
    stroke: none;
    cursor: ns-resize;
    pointer-events: all;
    touch-action: none;
  }

  .group-frame-title {
    fill: var(--edge-selected);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    pointer-events: none;
  }

  .word-box.drop-target {
    stroke: var(--edge-selected);
    stroke-width: 2.6;
    fill: rgba(244, 195, 99, 0.18);
  }

  .word-box.frame-target {
    stroke: var(--danger);
    stroke-width: 2.6;
    fill: rgba(224, 135, 107, 0.16);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 14, 26, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--paper-card);
    border: 1px solid var(--grid-line-strong);
    border-radius: 4px;
    padding: 22px 26px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(4, 14, 26, 0.5);
  }
  .modal-box p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
  }
  .modal-actions button { min-width: 80px; }
  #confirmOkBtn { background: var(--accent); color: #0B2036; font-weight: 600; }
  #confirmOkBtn:hover { opacity: 0.88; }
  #confirmCancelBtn { background: transparent; color: var(--ink-dim); border-color: var(--grid-line-strong); }
  #confirmCancelBtn:hover { color: var(--ink); border-color: var(--ink-dim); }

  @media (max-width: 720px) {
    .wrap { padding: 0 16px; }
    .topbar .wrap { padding-top: 14px; padding-bottom: 14px; }
    .content-scroll .wrap { padding-top: 18px; padding-bottom: 18px; }
    h1 { font-size: 21px; }
    .eyebrow { font-size: 10.5px; }
    .subtitle { font-size: 13px; }
    header { padding: 0; margin: 0; }
    .panel { padding: 12px 14px; }
    .sentence-row { gap: 8px; padding: 10px 0; }
    .row-label { min-width: 26px; font-size: 10px; padding-top: 8px; }
    #addBtn, #clarifyBtn, #frameBtn { width: 42px; height: 42px; font-size: 18px; }
    .statusbar .wrap { font-size: 10.5px; gap: 8px 14px; }
  }

  @media (max-width: 460px) {
    .input-row { flex-wrap: wrap; }
    #sentenceInput { flex: 1 1 100%; }
    .line-style-row { flex-wrap: wrap; }
    .statusbar .wrap { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <header>
        <h1>Кресленик речень <span class="app-version" id="appVersion">v1.13.9</span></h1>
      </header>

      <div class="panel">
        <div class="input-row">
          <input type="text" id="sentenceInput" placeholder="Введіть текст прямокутника…" autocomplete="off">
          <button id="addBtn" title="Додати">+</button>
          <button id="clarifyBtn" title="Уточнити">✎</button>
          <button id="frameBtn" title="Рамка визначень">⬚</button>
        </div>
        <div class="line-style-row" id="lineStyleRow">
          <div class="line-style-icons">
            <button class="line-style-btn" data-line-type="solid" title="Суцільна лінія">
              <svg viewBox="0 0 48 20" width="48" height="20"><line x1="4" y1="10" x2="44" y2="10" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="line-style-btn" data-line-type="dashed" title="Пунктирна лінія">
              <svg viewBox="0 0 48 20" width="48" height="20"><line x1="4" y1="10" x2="44" y2="10" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/></svg>
            </button>
            <button class="line-style-btn" data-line-type="double" title="Подвійна суцільна лінія">
              <svg viewBox="0 0 48 20" width="48" height="20"><line x1="4" y1="7" x2="44" y2="7" stroke="currentColor" stroke-width="2"/><line x1="4" y1="13" x2="44" y2="13" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
          <div class="row-actions">
            <button class="row-delete-top" id="editSentenceBtn" title="Редагувати текст">✏</button>
            <button class="row-delete-top" id="deleteSentenceBtn" title="Видалити графічне речення">🗑</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="content-scroll" id="contentScroll">
    <div class="wrap">
      <div id="canvasZoom">
        <div id="sentenceList"></div>
        <div id="emptyState" class="empty-state">Поки що немає жодного графічного речення. Введіть текст вище.</div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="wrap">
      <span id="countLabel">Речень додано: 0</span>
      <div class="target-indicator">
        <span>Додати до: <span class="target-value" id="targetLabel">новий термін</span></span>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOutBtn" title="Зменшити">−</button>
        <span id="zoomLabel">100%</span>
        <button class="zoom-btn" id="zoomInBtn" title="Збільшити">+</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal-box">
      <p id="confirmMessage">Ви впевнені?</p>
      <div class="modal-actions">
        <button id="confirmOkBtn">Ок</button>
        <button id="confirmCancelBtn">Ні</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // Кожне графічне речення — це дерево прямокутників (nodes), з'єднаних
  // ребрами (edges) із заданим типом лінії. STORAGE.sentences — масив таких дерев.
  var STORAGE = { sentences: [], nextNodeId: 1 };

  // Поточний вибір: прямокутник (type: 'node'), лінія-зв'язок (type: 'edge')
  // або рамка групування визначень (type: 'group').
  // null означає «нічого не вибрано» — наступне «Додати» створить нове графічне речення.
  var selection = { type: null, sentenceIndex: null, nodeId: null, parentId: null, childId: null, groupId: null };

  // Тип лінії, який буде застосовано до наступного доданого з'єднання.
  var currentLineType = 'solid';

  var input = document.getElementById('sentenceInput');
  var addBtn = document.getElementById('addBtn');
  var clarifyBtn = document.getElementById('clarifyBtn');
  var frameBtn = document.getElementById('frameBtn');
  var lineStyleButtons = Array.prototype.slice.call(document.querySelectorAll('.line-style-btn'));
  var list = document.getElementById('sentenceList');

  // Клік по порожньому тлу (не по прямокутнику, лінії, рамці чи маркеру
  // рамки) знімає поточний вибір і завершує режим редагування тексту —
  // раніше такого обробника не було зовсім, тому кнопка «✏» могла лишатись
  // підсвіченою після кліку повз усі елементи діаграми.
  list.addEventListener('click', function (e) {
    var onInteractive = e.target.closest(
      '.word-box, .link-hit, .group-frame-hit, .frame-handle-hit, .node-edit-input'
    );
    if (!onInteractive) clearSelection();
  });
  var emptyState = document.getElementById('emptyState');
  var countLabel = document.getElementById('countLabel');
  var targetLabel = document.getElementById('targetLabel');
  var canvasZoom = document.getElementById('canvasZoom');
  var zoomInBtn = document.getElementById('zoomInBtn');
  var zoomOutBtn = document.getElementById('zoomOutBtn');
  var zoomLabel = document.getElementById('zoomLabel');
  var editSentenceBtn = document.getElementById('editSentenceBtn');
  var deleteSentenceBtn = document.getElementById('deleteSentenceBtn');
  var confirmModal = document.getElementById('confirmModal');
  var confirmMessage = document.getElementById('confirmMessage');
  var confirmOkBtn = document.getElementById('confirmOkBtn');
  var confirmCancelBtn = document.getElementById('confirmCancelBtn');

  // Вузол, текст якого зараз редагується (основний текст і/або уточнюючі
  // рядки стають полями вводу). Активується кнопкою «✏» лише для вибраного
  // прямокутника і скидається одразу, як тільки вибір змінюється/знімається.
  var editingTarget = null;

  // Заголовок рамки групування, що зараз редагується через основне поле
  // вводу: { sentenceIndex, groupId }. Активується кнопкою «✏» при вибраній
  // рамці; поточний заголовок (якщо є) підставляється в поле вводу, після
  // чого натискання «Додати» зберігає введений текст як заголовок рамки.
  var groupTitleEdit = null;
  var DEFAULT_INPUT_PLACEHOLDER = input.getAttribute('placeholder') || 'Введіть текст прямокутника…';

  // Лічильник id для нових рамок групування; окремого «активного режиму»
  // рамки більше немає — рамка вибирається/знімається кліком, як node/edge.
  var nextGroupId = 1;

  // Стан перетягування маркера рамки (розширення/звуження на сиблінгів вгору/вниз).
  var frameDrag = null;
  // Стан перетягування прямокутника терміну/визначення на інший прямокутник
  // для створення нового зв'язку (переприв'язки вузла до нового батька).
  var nodeDrag = null;
  var DRAG_THRESHOLD = 6;

  var zoomLevel = 1;
  var ZOOM_MIN = 0.5;
  var ZOOM_MAX = 2;
  var ZOOM_STEP = 0.1;

  var SVG_NS = "http://www.w3.org/2000/svg";
  var BOX_HEIGHT = 44;
  // Зменшена втричі (порівняно з BOX_HEIGHT) висота «шапки» прямокутника —
  // застосовується, коли всередині є уточнюючі рядки, щоб відстань між
  // рядком терміну та рядком уточнення була значно меншою.
  var HEADER_HEIGHT_WITH_NOTES = 27;
  var BOX_PAD_X = 16;
  var NOTE_LINE_HEIGHT = 20;
  var SIBLING_GAP = 30;
  var LEVEL_GAP = 64;
  var ROW_PAD = 12;
  var FONT = "500 15px 'IBM Plex Mono', monospace";

  // Параметри рамки групування та її заголовка.
  var FRAME_PAD = 10;
  var TITLE_FONT = "600 10px 'IBM Plex Mono', monospace";
  var TITLE_PAD_X = 10;
  var TITLE_LINE_HEIGHT = 13;
  var TITLE_TOP_GAP = 6;
  var TITLE_BOTTOM_GAP = 4;

  var measureCanvas = document.createElement('canvas');
  var measureCtx = measureCanvas.getContext('2d');
  measureCtx.font = FONT;

  var titleMeasureCanvas = document.createElement('canvas');
  var titleMeasureCtx = titleMeasureCanvas.getContext('2d');
  titleMeasureCtx.font = TITLE_FONT;

  function measureTitleWidth(text) {
    return titleMeasureCtx.measureText(text).width;
  }

  // Розбиває текст заголовка рамки на рядки, що вміщуються в maxWidth
  // (перенесення по словах; якщо саме слово довше за maxWidth — розбиває
  // його по символах, щоб текст ніколи не виходив за межі рамки).
  function wrapTitleText(text, maxWidth) {
    var safeWidth = Math.max(maxWidth, 20);
    var words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    var lines = [];
    var current = '';
    words.forEach(function (word) {
      var candidate = current ? current + ' ' + word : word;
      if (measureTitleWidth(candidate) <= safeWidth) {
        current = candidate;
        return;
      }
      if (current) { lines.push(current); current = ''; }
      if (measureTitleWidth(word) <= safeWidth) {
        current = word;
        return;
      }
      var piece = '';
      for (var i = 0; i < word.length; i++) {
        var testPiece = piece + word[i];
        if (measureTitleWidth(testPiece) > safeWidth && piece) {
          lines.push(piece);
          piece = word[i];
        } else {
          piece = testPiece;
        }
      }
      current = piece;
    });
    if (current) lines.push(current);
    return lines;
  }

  function measureTextWidth(text) {
    return measureCtx.measureText(text).width;
  }

  function createNode(text) {
    var node = {
      id: STORAGE.nextNodeId++,
      text: text,
      notes: [], // уточнюючі рядки всередині того самого прямокутника
      children: [] // { node, lineType }
    };
    return node;
  }

  function findNode(root, nodeId) {
    if (root.id === nodeId) return root;
    for (var i = 0; i < root.children.length; i++) {
      var found = findNode(root.children[i].node, nodeId);
      if (found) return found;
    }
    return null;
  }

  function findEdge(root, parentId, childId) {
    var parent = findNode(root, parentId);
    if (!parent) return null;
    for (var i = 0; i < parent.children.length; i++) {
      if (parent.children[i].node.id === childId) return parent.children[i];
    }
    return null;
  }

  // Знаходить батьківський прямокутник вузла та його індекс серед children
  // батька. Повертає null, якщо вузол — корінь (немає батька в дереві).
  function findParent(root, nodeId) {
    for (var i = 0; i < root.children.length; i++) {
      if (root.children[i].node.id === nodeId) {
        return { parent: root, index: i };
      }
      var deeper = findParent(root.children[i].node, nodeId);
      if (deeper) return deeper;
    }
    return null;
  }

  // Повертає id вузла та всіх його нащадків (для видалення/перевірки циклів
  // при перетягуванні прямокутника на інший).
  function collectSubtreeIds(node) {
    var ids = [node.id];
    node.children.forEach(function (edge) {
      ids = ids.concat(collectSubtreeIds(edge.node));
    });
    return ids;
  }

  // Обчислює позиції (x, y, width, height) усіх прямокутників дерева так, щоб
  // наступний прямокутник малювався ПРАВОРУЧ від попереднього (по рівнях-колонках),
  // а сиблінги одного батька розташовувались один під одним, не перекриваючись.
  // Рахує, скільки додаткового вертикального відступу треба зарезервувати
  // безпосередньо ПЕРЕД першим і ПІСЛЯ останнього прямокутника-члена кожної
  // рамки групування — саме за рахунок цього резерву сусідні (не члени)
  // прямокутники автоматично «розступаються», коли рамка займає більше
  // місця (через власний відступ, вкладеність в іншу рамку чи заголовок), а
  // не залишаються на місці, накладаючись на розширену рамку — так само, як
  // це прийнято в програмах для ментальних карт.
  function computeGroupBoundaryExtras(root, groups, columnX, maxWidthByDepth) {
    var beforeMap = {}, afterMap = {};
    (groups || []).forEach(function (group) {
      if (!group.nodeIds || !group.nodeIds.length) return;
      var siblings;
      if (group.parentId === null) {
        siblings = [{ node: root }];
      } else {
        var parent = findNode(root, group.parentId);
        siblings = parent ? parent.children : null;
      }
      if (!siblings) return;
      var idxList = [];
      siblings.forEach(function (edge, idx) {
        if (group.nodeIds.indexOf(edge.node.id) !== -1) idxList.push(idx);
      });
      if (!idxList.length) return;
      var minIdx = Math.min.apply(null, idxList);
      var maxIdx = Math.max.apply(null, idxList);
      var firstId = siblings[minIdx].node.id;
      var lastId = siblings[maxIdx].node.id;
      // Прогнозована ширина рамки (по X вона вже остаточна на цьому етапі,
      // бо columnX/ширини прямокутників не залежать від подальшого
      // розташування по Y) — рахуємо так само, як реальні межі рамки, щоб
      // отримати ТОЧНУ (а не приблизну) кількість рядків перенесеного
      // заголовка.
      var minDepth = Infinity, maxRight = -Infinity;
      group.nodeIds.forEach(function (id) {
        var n = findNode(root, id);
        if (!n) return;
        collectFrameSubtreeIds(n, group.id, group.nodeIds).forEach(function (descId) {
          var d = findNode(root, descId);
          if (!d || columnX[d.depth] === undefined) return;
          minDepth = Math.min(minDepth, d.depth);
          maxRight = Math.max(maxRight, columnX[d.depth] + d.width);
        });
      });
      var titleAllowance = 0;
      if (group.title && minDepth !== Infinity) {
        var frameW = maxRight - columnX[minDepth] + FRAME_PAD * 2;
        var titleLines = wrapTitleText(group.title, frameW - TITLE_PAD_X * 2);
        titleAllowance = titleLines.length ? (TITLE_TOP_GAP + titleLines.length * TITLE_LINE_HEIGHT + TITLE_BOTTOM_GAP) : 0;
      }
      var extraTop = FRAME_PAD + NESTED_FRAME_GAP + titleAllowance;
      var extraBottom = FRAME_PAD + NESTED_FRAME_GAP;
      beforeMap[firstId] = Math.max(beforeMap[firstId] || 0, extraTop);
      afterMap[lastId] = Math.max(afterMap[lastId] || 0, extraBottom);
    });
    return { before: beforeMap, after: afterMap };
  }

  function layoutTree(root, groups) {
    var maxWidthByDepth = [];
    var maxDepth = 0;

    function measure(node, depth) {
      maxDepth = Math.max(maxDepth, depth);
      var lines = [node.text].concat(node.notes || []);
      var widest = 0;
      lines.forEach(function (line) {
        widest = Math.max(widest, measureTextWidth(line));
      });
      var hasNotes = !!(node.notes && node.notes.length);
      node.width = Math.max(widest + BOX_PAD_X * 2, 40);
      node.headerHeight = hasNotes ? HEADER_HEIGHT_WITH_NOTES : BOX_HEIGHT;
      node.height = node.headerHeight + (hasNotes ? node.notes.length * NOTE_LINE_HEIGHT + 6 : 0);
      node.depth = depth;
      maxWidthByDepth[depth] = Math.max(maxWidthByDepth[depth] || 0, node.width);
      node.children.forEach(function (edge) {
        measure(edge.node, depth + 1);
      });
    }
    measure(root, 0);

    var columnX = [ROW_PAD];
    for (var d = 1; d <= maxDepth; d++) {
      columnX[d] = columnX[d - 1] + maxWidthByDepth[d - 1] + LEVEL_GAP;
    }

    // Резерв місця під рамки рахуємо ТІЛЬКИ ПІСЛЯ вимірювання ширин і
    // побудови колонок (columnX) — на цьому етапі вже точно відома
    // прогнозована ширина кожної рамки, а отже й точна кількість рядків, на
    // які реально перенесеться її заголовок (замість грубої консервативної
    // оцінки «до 2 рядків», яка могла применшити фактичну висоту заголовка
    // з 3+ рядками і призвести до накладання прямокутника на контур рамки).
    var boundaryExtras = computeGroupBoundaryExtras(root, groups, columnX, maxWidthByDepth);

    var cursorY = ROW_PAD;

    function place(node) {
      // Якщо цей вузол — перший член якоїсь рамки, резервуємо місце зверху
      // (щоб не наїхати на попередній, не пов'язаний із рамкою прямокутник);
      // якщо останній — резервуємо місце знизу для наступного.
      cursorY += (boundaryExtras.before[node.id] || 0);
      node.x = columnX[node.depth];

      if (node.children.length === 0) {
        node.y = cursorY;
        cursorY += node.height + SIBLING_GAP;
      } else {
        node.children.forEach(function (edge) {
          place(edge.node);
        });
        var first = node.children[0].node;
        var last = node.children[node.children.length - 1].node;
        var firstCenter = first.y + first.height / 2;
        var lastCenter = last.y + last.height / 2;
        node.y = (firstCenter + lastCenter) / 2 - node.height / 2;
      }

      cursorY += (boundaryExtras.after[node.id] || 0);
    }

    place(root);

    var totalWidth = columnX[maxDepth] + maxWidthByDepth[maxDepth] + ROW_PAD;
    var totalHeight = cursorY - SIBLING_GAP + ROW_PAD;
    return { width: totalWidth, height: totalHeight };
  }

  function buildConnectorPath(x1, y1, x2, y2, yOffset) {
    var oy1 = y1 + yOffset;
    var oy2 = y2 + yOffset;
    var midX = (x1 + x2) / 2;
    return 'M ' + x1 + ' ' + oy1 + ' C ' + midX + ' ' + oy1 + ', ' + midX + ' ' + oy2 + ', ' + x2 + ' ' + oy2;
  }

  function drawConnector(svg, fromNode, toNode, lineType, isSelected) {
    var x1 = fromNode.x + fromNode.width;
    var y1 = fromNode.y + fromNode.height / 2;
    var x2 = toNode.x;
    var y2 = toNode.y + toNode.height / 2;

    var hit = document.createElementNS(SVG_NS, 'path');
    hit.setAttribute('class', 'link-hit');
    hit.setAttribute('d', buildConnectorPath(x1, y1, x2, y2, 0));
    svg.appendChild(hit);

    if (lineType === 'double') {
      [-2.5, 2.5].forEach(function (offset) {
        var path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('class', 'link-line line-double' + (isSelected ? ' selected' : ''));
        path.setAttribute('d', buildConnectorPath(x1, y1, x2, y2, offset));
        svg.appendChild(path);
      });
    } else {
      var path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('class', 'link-line line-' + lineType + (isSelected ? ' selected' : ''));
      path.setAttribute('d', buildConnectorPath(x1, y1, x2, y2, 0));
      svg.appendChild(path);
    }

    return hit;
  }

  // Створює foreignObject з <input> для редагування тексту прямокутника
  // (основний текст або один рядок уточнення) прямо всередині SVG.
  // onSave(value, commit) викликається на кожне введення (commit=false, без
  // перебудови — щоб не втрачати фокус) і при втраті фокусу/Enter (commit=true,
  // з повним рендером, щоб перерахувати розмір прямокутника).
  function createEditableField(x, y, width, height, value, extraClass, onSave) {
    var fo = document.createElementNS(SVG_NS, 'foreignObject');
    fo.setAttribute('x', x);
    fo.setAttribute('y', y);
    fo.setAttribute('width', width);
    fo.setAttribute('height', height);

    var inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'node-edit-input' + (extraClass ? ' ' + extraClass : '');
    inputEl.value = value;
    inputEl.addEventListener('click', function (e) { e.stopPropagation(); });
    inputEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    inputEl.addEventListener('input', function (e) { onSave(e.target.value, false); });
    inputEl.addEventListener('blur', function (e) { onSave(e.target.value, true); });
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
    });

    fo.appendChild(inputEl);
    return { fo: fo, inputEl: inputEl };
  }

  // Обходить піддерево вузла для меж КОНКРЕТНОЇ рамки (groupId), АЛЕ не
  // заходить у гілки, з'єднані як «до цієї самої рамки» (edge.frameGroupId
  // === groupId) — такі прямокутники навмисно створені ЗОВНІ саме цієї
  // рамки. Проте якщо ця гілка технічно є нащадком члена ІНШОЇ (зовнішньої,
  // охоплюючої) рамки, для меж ТІЄЇ зовнішньої рамки її пропускати не треба —
  // зовнішня рамка має розширюватись і під такий прямокутник теж.
  // Виняток: якщо вузол, до якого приєднано такий «зовнішній» прямокутник
  // (доданий до ІНШОЇ рамки), сам є ПРЯМИМ членом ПОТОЧНОЇ групи (groupNodeIds)
  // — тобто дві рамки мають спільний прямокутник-член — така гілка все одно
  // пропускається. Інакше прямокутник, доданий «до» однієї рамки через
  // спільний вузол, помилково потрапляв би й у межі ІНШОЇ (напр. вкладеної)
  // рамки, що має цей самий вузол своїм членом, і та рамка неправильно
  // розширювалась би, охоплюючи чужий доданий прямокутник.
  function collectFrameSubtreeIds(node, groupId, groupNodeIds, out) {
    out = out || [];
    out.push(node.id);
    node.children.forEach(function (edge) {
      if (edge.frameGroupId === groupId) return;
      if (edge.frameGroupId && groupNodeIds && groupNodeIds.indexOf(node.id) !== -1) return;
      collectFrameSubtreeIds(edge.node, groupId, groupNodeIds, out);
    });
    return out;
  }

  // Обчислює межі (minX/minY/maxX/maxY) прямокутників, що входять до рамки
  // групування, на основі вже розрахованих layoutTree координат вузлів.
  function computeGroupBounds(root, group) {
    if (!group.nodeIds || !group.nodeIds.length) return null;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    // Рамка охоплює не лише самі прямокутники-члени групи, а й усі їхні
    // дочірні прямокутники (усю гілку) — тому вона тепер розширюється не
    // лише вгору/вниз, а й вправо, автоматично захоплюючи дочірні елементи;
    // новий дочірній прямокутник, доданий до вже згрупованого прямокутника,
    // одразу опиняється в межах рамки без додаткових дій. Прямокутник,
    // доданий «до цієї самої рамки» (frameGroupId === group.id), у це
    // обчислення не входить — але якщо він доданий «до» ІНШОЇ, внутрішньої
    // рамки, ця (зовнішня) рамка все одно розшириться під нього.
    group.nodeIds.forEach(function (id) {
      var n = findNode(root, id);
      if (!n) return;
      collectFrameSubtreeIds(n, group.id, group.nodeIds).forEach(function (descId) {
        var d = findNode(root, descId);
        if (!d) return;
        minX = Math.min(minX, d.x);
        minY = Math.min(minY, d.y);
        maxX = Math.max(maxX, d.x + d.width);
        maxY = Math.max(maxY, d.y + d.height);
      });
    });
    if (minX === Infinity) return null;
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  // Межі рамки, пораховані ЛИШЕ за прямокутниками-членами групи (без їхніх
  // нащадків) — саме сиблінги завжди стоять в одній колонці по X. Потрібні,
  // щоб маркери розширення рамки (▲/▼) горизонтально лишались точно над цією
  // колонкою сиблінгів, навіть якщо сама рамка розширена вправо дочірніми
  // прямокутниками одного з членів (інакше вертикальне перетягування маркера
  // вже не проходило б над сусідніми сиблінгами і не могло розширити рамку).
  function computeGroupMemberBounds(root, group) {
    if (!group.nodeIds || !group.nodeIds.length) return null;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    group.nodeIds.forEach(function (id) {
      var n = findNode(root, id);
      if (!n) return;
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + n.width);
      maxY = Math.max(maxY, n.y + n.height);
    });
    if (minX === Infinity) return null;
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  // Додатковий відступ між межею рамки, що структурно містить іншу
  // (вкладену) рамку, і межею самої вкладеної рамки — щоб їхні заголовки й
  // пунктирні межі ніколи не перекривались.
  var NESTED_FRAME_GAP = 22;

  function rectFullyContains(outer, inner) {
    return outer.x <= inner.x + 0.01 && outer.y <= inner.y + 0.01 &&
      (outer.x + outer.width) >= (inner.x + inner.width) - 0.01 &&
      (outer.y + outer.height) >= (inner.y + inner.height) - 0.01;
  }

  // Приймає базові прямокутники рамок (за вмістом + звичайний відступ) і
  // розширює ті з них, що повністю охоплюють інші рамки, додаючи
  // NESTED_FRAME_GAP навколо кожної вкладеної рамки, яку вони містять —
  // інакше межі й підписи-заголовки різних (особливо вкладених одна в одну)
  // рамок можуть торкатись або перекривати одне одного.
  function expandNestedFrameRects(baseRects, gbList) {
    var rects = baseRects.map(function (r) {
      return r ? { x: r.x, y: r.y, width: r.width, height: r.height } : null;
    });
    // Структурну вкладеність (яка рамка «містить» яку) визначаємо за межами
    // ЛИШЕ вмісту (gb) з відступом FRAME_PAD, БЕЗ місця під заголовок —
    // інакше додавання/зміна заголовка внутрішньої рамки могла збільшити її
    // titled-прямокутник настільки, що він переставав вважатись «повністю
    // вкладеним» у зовнішню (ще нерозширену) рамку, і зовнішня рамка просто
    // не розширювалась під неї.
    var plainRects = (gbList || []).map(function (gb) {
      if (!gb) return null;
      return {
        x: gb.minX - FRAME_PAD,
        y: gb.minY - FRAME_PAD,
        width: (gb.maxX - gb.minX) + FRAME_PAD * 2,
        height: (gb.maxY - gb.minY) + FRAME_PAD * 2
      };
    });
    var containsList = rects.map(function (rect, idx) {
      if (!rect) return [];
      var plainRect = plainRects[idx] || rect;
      var list = [];
      rects.forEach(function (other, j) {
        if (j === idx || !other) return;
        var otherPlain = plainRects[j] || other;
        if (rectFullyContains(plainRect, otherPlain) && !rectFullyContains(otherPlain, plainRect)) list.push(j);
      });
      return list;
    });
    var order = rects.map(function (_, idx) { return idx; })
      .filter(function (idx) { return rects[idx]; })
      .sort(function (a, b) { return containsList[a].length - containsList[b].length; });
    order.forEach(function (idx) {
      var kids = containsList[idx];
      if (!kids.length) return;
      var rect = rects[idx];
      var minX = rect.x, minY = rect.y, maxX = rect.x + rect.width, maxY = rect.y + rect.height;
      kids.forEach(function (kidIdx) {
        var kid = rects[kidIdx];
        minX = Math.min(minX, kid.x - NESTED_FRAME_GAP);
        minY = Math.min(minY, kid.y - NESTED_FRAME_GAP);
        maxX = Math.max(maxX, kid.x + kid.width + NESTED_FRAME_GAP);
        maxY = Math.max(maxY, kid.y + kid.height + NESTED_FRAME_GAP);
      });
      rect.x = minX; rect.y = minY; rect.width = maxX - minX; rect.height = maxY - minY;
    });
    return rects;
  }

  // Базові (до розсування вкладених) межі рамки за вмістом — спільна логіка
  // для попереднього (pre-shift) прорахунку відступу діаграми й для
  // остаточного рендеру.
  function computeBaseFrameRect(gb, meta) {
    if (!gb || !meta) return null;
    return {
      x: gb.minX - FRAME_PAD,
      y: gb.minY - meta.topPad,
      width: (gb.maxX - gb.minX) + FRAME_PAD * 2,
      height: (gb.maxY - gb.minY) + meta.topPad + FRAME_PAD
    };
  }

  // Зсуває y-координату всього піддерева на dy (використовується, коли для
  // заголовка рамки групування, що охоплює найвищі прямокутники, не вистачає
  // місця над діаграмою — інакше рамка/заголовок обрізались би зверху; а
  // також для вирівнювання прямокутників, доданих «до рамки», по її осі).
  function shiftTreeY(node, dy) {
    node.y += dy;
    node.children.forEach(function (edge) { shiftTreeY(edge.node, dy); });
  }

  // Зсуває x-координату всього піддерева на dx — потрібно, щоб прямокутник,
  // доданий «до рамки», завжди опинявся ЗОВНІ рамки, праворуч від неї, з
  // лінією від її краю (як і для будь-якого звичайного прямокутника), а не
  // прив'язувався до колонки того члена групи, до якого технічно приєднаний
  // у дереві (інакше він міг би опинитись у тій самій колонці, що й реальні
  // дочірні прямокутники всередині рамки, і візуально потрапити всередину).
  function shiftTreeX(node, dx) {
    node.x += dx;
    node.children.forEach(function (edge) { shiftTreeX(edge.node, dx); });
  }

  // Знаходить мінімальний/максимальний y (з урахуванням висоти) серед усіх
  // прямокутників дерева — потрібно, щоб знати, чи вистачає місця над/під
  // діаграмою після вирівнювання прямокутників рамки.
  function computeTreeYRange(node) {
    var minY = node.y, maxY = node.y + node.height;
    node.children.forEach(function (edge) {
      var r = computeTreeYRange(edge.node);
      minY = Math.min(minY, r.minY);
      maxY = Math.max(maxY, r.maxY);
    });
    return { minY: minY, maxY: maxY };
  }

  // Максимальний x (з урахуванням ширини) серед усіх прямокутників дерева —
  // потрібно, щоб розширити ширину діаграми, якщо прямокутник, доданий «до
  // рамки», примусово зсунуто правіше, ніж передбачала звичайна розкладка
  // по колонках глибини дерева.
  function computeTreeXRange(node) {
    var maxX = node.x + node.width;
    node.children.forEach(function (edge) {
      maxX = Math.max(maxX, computeTreeXRange(edge.node));
    });
    return maxX;
  }

  // Знаходить усі ребра, додані «до рамки» (edge.frameGroupId === group.id),
  // і вирівнює їх вертикально відносно горизонтальної осі рамки: перший
  // такий прямокутник ставиться точно по центру рамки (пряма лінія), а
  // кілька — розташовуються стовпчиком, відцентрованим на цій же осі (тоді
  // лінії природно стають дугоподібними, як і для звичайних сиблінгів).
  function repositionFrameChildren(root, group, frameCenterY, frameRightX) {
    var edges = [];
    (function walk(node) {
      node.children.forEach(function (edge) {
        if (edge.frameGroupId === group.id) edges.push(edge);
        walk(edge.node);
      });
    })(root);
    if (!edges.length) return;

    // Горизонтально примусово ставимо кожен такий прямокутник одразу за
    // правим краєм самої рамки (з тим самим відступом, що й між звичайними
    // колонками), незалежно від того, на яку глибину дерева він технічно
    // приєднаний — інакше, якщо член групи вже мав власні дочірні
    // прямокутники в тій самій колонці, новий «зовнішній» прямокутник міг
    // опинитись візуально всередині рамки.
    var targetX = frameRightX + LEVEL_GAP;
    edges.forEach(function (edge) {
      var n = edge.node;
      if (n.x !== targetX) shiftTreeX(n, targetX - n.x);
    });

    if (edges.length === 1) {
      var only = edges[0].node;
      shiftTreeY(only, frameCenterY - (only.y + only.height / 2));
      return;
    }

    var totalHeight = 0;
    edges.forEach(function (edge, idx) {
      totalHeight += edge.node.height;
      if (idx > 0) totalHeight += SIBLING_GAP;
    });
    var cursor = frameCenterY - totalHeight / 2;
    edges.forEach(function (edge) {
      var n = edge.node;
      shiftTreeY(n, cursor - n.y);
      cursor += n.height + SIBLING_GAP;
    });
  }

  function buildDiagram(sentence, sentenceIndex) {
    var root = sentence.root;
    var svg = document.createElementNS(SVG_NS, 'svg');
    var groupsList = sentence.groups || [];
    var bounds = layoutTree(root, groupsList);
    var HANDLE_R = 6;
    var HANDLE_HIT_R = 15;

    // Рахує (за поточними координатами вузлів) для кожної групи: межі вмісту,
    // потрібну висоту під заголовок і остаточний (з розсуванням вкладених
    // рамок) прямокутник рамки.
    function computeGroupMetaAndRects() {
      var gbList = groupsList.map(function (group) { return computeGroupBounds(root, group); });
      var meta = groupsList.map(function (group, idx) {
        var gb = gbList[idx];
        if (!gb) return null;
        var frameW = (gb.maxX - gb.minX) + FRAME_PAD * 2;
        var titleLines = group.title ? wrapTitleText(group.title, frameW - TITLE_PAD_X * 2) : [];
        var titleAreaHeight = titleLines.length ? (TITLE_TOP_GAP + titleLines.length * TITLE_LINE_HEIGHT + TITLE_BOTTOM_GAP) : 0;
        var topPad = FRAME_PAD + titleAreaHeight;
        return { titleLines: titleLines, topPad: topPad };
      });
      var rects = expandNestedFrameRects(groupsList.map(function (group, idx) {
        return computeBaseFrameRect(gbList[idx], meta[idx]);
      }), gbList);
      return { gbList: gbList, meta: meta, rects: rects };
    }

    // Вирівнює прямокутники, додані «до рамки» кожної групи, по ПРАВОМУ краю
    // ОСТАТОЧНОГО (уже з розсуванням вкладених рамок) прямокутника цієї рамки
    // — а не за сирими межами вмісту — щоб такий прямокутник завжди йшов
    // услід за рамкою, коли та розширюється вправо.
    function alignFrameChildren(computed) {
      groupsList.forEach(function (group, idx) {
        var gb = computed.gbList[idx];
        var fr = computed.rects[idx];
        if (!gb || !fr) return;
        repositionFrameChildren(root, group, gb.minY + (gb.maxY - gb.minY) / 2, fr.x + fr.width);
      });
    }

    // Крок 1: перший прохід — вирівнюємо «зовнішні» прямокутники за першим
    // наближенням меж рамок; крок 2: перераховуємо межі (вони могли трохи
    // вирости, якщо якась рамка охоплює вкладену з таким прямокутником) і
    // вирівнюємо ще раз за вже точними межами.
    alignFrameChildren(computeGroupMetaAndRects());
    var pass2 = computeGroupMetaAndRects();
    alignFrameChildren(pass2);
    var groupMeta = pass2.meta;

    // Крок 3: чи вийшли якісь прямокутники або рамки за межі y=0 — і
    // зсуваємо/розширюємо діаграму так, щоб усе було видно.
    var yRange = computeTreeYRange(root);
    var minFrameTop = Math.min(0, yRange.minY);
    pass2.rects.forEach(function (r) {
      if (r) minFrameTop = Math.min(minFrameTop, r.y);
    });

    var offsetY = minFrameTop < 0 ? Math.ceil(-minFrameTop) : 0;
    if (offsetY > 0) shiftTreeY(root, offsetY);

    // Остаточні (уже після зсуву діаграми) межі кожної рамки — рахуємо їх ДО
    // встановлення розмірів SVG, бо розсунута зовнішня рамка чи вирівняний
    // «зовнішній» прямокутник можуть виступати за межі, які раніше
    // визначались лише самими прямокутниками дерева.
    var finalComputed = computeGroupMetaAndRects();
    var finalGroupBoundsList = finalComputed.gbList;
    var finalFrameRects = finalComputed.rects;
    var frameMaxRight = 0, frameMaxBottom = 0;
    finalFrameRects.forEach(function (r) {
      if (!r) return;
      frameMaxRight = Math.max(frameMaxRight, r.x + r.width);
      frameMaxBottom = Math.max(frameMaxBottom, r.y + r.height);
    });

    var totalHeight = Math.max(bounds.height, yRange.maxY + ROW_PAD, frameMaxBottom + ROW_PAD) + offsetY;
    var totalWidth = Math.max(bounds.width, computeTreeXRange(root) + ROW_PAD, frameMaxRight + ROW_PAD);
    svg.setAttribute('width', totalWidth);
    svg.setAttribute('height', totalHeight);
    svg.setAttribute('viewBox', '0 0 ' + totalWidth + ' ' + totalHeight);

    // Межі рамок груп (у координатах після зсуву) — використовуються нижче,
    // щоб прив'язати лінію нового прямокутника, доданого «до рамки», до
    // правого краю самої рамки, а не до конкретного прямокутника всередині.
    var frameBoundsByGroupId = {};

    groupsList.forEach(function (group, idx) {
      var gb = finalGroupBoundsList[idx];
      if (!gb) return;
      var meta = groupMeta[idx];
      var fr = finalFrameRects[idx];
      if (!fr) return;
      var isSelected = selection.type === 'group' && selection.sentenceIndex === sentenceIndex && selection.groupId === group.id;
      var frameX = fr.x;
      var frameY = fr.y;
      var frameW = fr.width;
      var frameH = fr.height;
      frameBoundsByGroupId[group.id] = { x: frameX, y: frameY, width: frameW, height: frameH };

      var frameRect = document.createElementNS(SVG_NS, 'rect');
      frameRect.setAttribute('class', 'group-frame' + (isSelected ? ' selected' : ''));
      frameRect.setAttribute('x', frameX);
      frameRect.setAttribute('y', frameY);
      frameRect.setAttribute('width', frameW);
      frameRect.setAttribute('height', frameH);
      frameRect.setAttribute('rx', 6);
      svg.appendChild(frameRect);

      // Окремий невидимий прямокутник із широкою «смугою» по краю — саме він
      // ловить клік. Тонкої пунктирної лінії (1.5px) самої по собі замало для
      // надійного повторного вибору рамки після зняття виділення.
      var frameHit = document.createElementNS(SVG_NS, 'rect');
      frameHit.setAttribute('class', 'group-frame-hit');
      frameHit.setAttribute('x', frameX);
      frameHit.setAttribute('y', frameY);
      frameHit.setAttribute('width', frameW);
      frameHit.setAttribute('height', frameH);
      frameHit.setAttribute('rx', 6);
      frameHit.addEventListener('click', function (e) {
        e.stopPropagation();
        selectGroup(sentenceIndex, group.id);
      });
      svg.appendChild(frameHit);

      if (meta && meta.titleLines.length) {
        var titleEl = document.createElementNS(SVG_NS, 'text');
        titleEl.setAttribute('class', 'group-frame-title');
        titleEl.setAttribute('x', frameX + TITLE_PAD_X);
        titleEl.setAttribute('y', frameY + TITLE_TOP_GAP + 8);
        meta.titleLines.forEach(function (line, lineIdx) {
          var tspan = document.createElementNS(SVG_NS, 'tspan');
          tspan.setAttribute('x', frameX + TITLE_PAD_X);
          if (lineIdx > 0) tspan.setAttribute('dy', TITLE_LINE_HEIGHT);
          tspan.textContent = line;
          titleEl.appendChild(tspan);
        });
        svg.appendChild(titleEl);
      }

      if (isSelected) {
        // Горизонтальна позиція маркерів прив'язана до колонки прямокутників-
        // членів групи (сиблінгів), а не до центру всієї (можливо розширеної
        // дочірніми прямокутниками) рамки — інакше вертикальне перетягування
        // маркера не проходило б над сусідніми сиблінгами.
        var memberBounds = computeGroupMemberBounds(root, group);
        var handleCenterX = memberBounds ? (memberBounds.minX + memberBounds.maxX) / 2 : (frameX + frameW / 2);
        [{ y: frameY, handle: 'top' }, { y: frameY + frameH, handle: 'bottom' }].forEach(function (spec) {
          // Окрема, більша за розміром невидима зона для pointerdown — на
          // планшетах/телефонах тонкий видимий маркер (r=6) складно вхопити
          // пальцем, тому клікабельна зона розширена (r=15) і має touch-action:none,
          // щоб браузер не перехоплював жест як прокрутку сторінки.
          var handleHit = document.createElementNS(SVG_NS, 'circle');
          handleHit.setAttribute('class', 'frame-handle-hit');
          handleHit.setAttribute('cx', handleCenterX);
          handleHit.setAttribute('cy', spec.y);
          handleHit.setAttribute('r', HANDLE_HIT_R);
          handleHit.addEventListener('pointerdown', function (e) {
            e.stopPropagation();
            e.preventDefault();
            console.log('[frame-drag] pointerdown', spec.handle, 'pointerType=' + e.pointerType, 'pointerId=' + e.pointerId);
            // Контур рамки одразу фарбується в червоний (--danger) — це
            // сигналізує користувачу, що дотик до маркера зафіксовано.
            // Посилання на root/group/meta та самі SVG-елементи рамки
            // зберігаються в frameDrag, щоб під час руху пальця можна було
            // напряму оновлювати їхню геометрію (без renderAll() — виклик
            // renderAll() під час активного дотику знищує DOM-елемент,
            // захоплений пальцем, і зриває жест pointercancel'ом).
            frameRect.classList.add('dragging');
            frameHit.classList.add('dragging');
            frameDrag = {
              sentenceIndex: sentenceIndex,
              groupId: group.id,
              handle: spec.handle,
              root: root,
              group: group,
              meta: meta,
              frameRectEl: frameRect,
              frameHitEl: frameHit,
              hoverEl: null,
              hoverNodeId: null,
              pastCenter: false,
              pendingRemove: false
            };
            try {
              handleHit.setPointerCapture(e.pointerId);
              console.log('[frame-drag] setPointerCapture ok');
            } catch (err) {
              console.log('[frame-drag] setPointerCapture failed:', err);
            }
            window.addEventListener('pointermove', onFrameDragMove);
            window.addEventListener('pointerup', onFrameDragEnd);
            window.addEventListener('pointercancel', onFrameDragCancel);
            // touch-action:none на самому SVG-маркері (.frame-handle-hit) не
            // завжди достатній — на реальних дотикових пристроях браузер
            // усе одно може вирішити, що це жест прокрутки, і скасувати
            // pointer (pointercancel) після кількох пікселів руху. Пряме
            // preventDefault() на нативній події touchmove (обов'язково з
            // passive:false, інакше preventDefault буде проігноровано)
            // надійно блокує прокрутку незалежно від touch-action.
            window.addEventListener('touchmove', blockScrollDuringFrameDrag, { passive: false });
          });
          svg.appendChild(handleHit);

          var handleEl = document.createElementNS(SVG_NS, 'circle');
          handleEl.setAttribute('class', 'frame-handle');
          handleEl.setAttribute('cx', handleCenterX);
          handleEl.setAttribute('cy', spec.y);
          handleEl.setAttribute('r', HANDLE_R);
          svg.appendChild(handleEl);
        });
      }
    });

    // Малювання розбито на два окремі проходи: спершу ВСІ лінії з'єднання
    // для всього дерева, потім ВСІ прямокутники з текстом. Це гарантує, що
    // жоден прямокутник ніколи не опиняється під невидимою (товстою, для
    // зручного клацання) лінією-хітбоксом сусідньої чи дальшої гілки —
    // інакше перетягування такого прямокутника не спрацьовувало б.
    function drawConnectors(node) {
      node.children.forEach(function (edge) {
        var isEdgeSelected = selection.type === 'edge' && selection.sentenceIndex === sentenceIndex &&
          selection.parentId === node.id && selection.childId === edge.node.id;
        // Якщо прямокутник додано «до рамки» (edge.frameGroupId), лінія
        // з'єднання малюється не від цього конкретного вузла, а від правого
        // краю самої рамки — так само, як прямокутник з'єднується з прямокутником.
        var sourceBox = node;
        if (edge.frameGroupId && frameBoundsByGroupId[edge.frameGroupId]) {
          var fb = frameBoundsByGroupId[edge.frameGroupId];
          sourceBox = { x: fb.x + fb.width, y: fb.y + fb.height / 2, width: 0, height: 0 };
        }
        var hit = drawConnector(svg, sourceBox, edge.node, edge.lineType, isEdgeSelected);
        hit.addEventListener('click', function () {
          selectEdge(sentenceIndex, node.id, edge.node.id);
        });
      });
      node.children.forEach(function (edge) {
        drawConnectors(edge.node);
      });
    }

    function drawNodeBox(node) {
      var isNodeSelected = selection.type === 'node' && selection.sentenceIndex === sentenceIndex && selection.nodeId === node.id;
      var isEditing = !!(editingTarget && editingTarget.sentenceIndex === sentenceIndex && editingTarget.nodeId === node.id);

      var rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('class', 'word-box' + (isNodeSelected ? ' selected' : ''));
      rect.setAttribute('data-node-id', node.id);
      rect.setAttribute('data-sentence-index', sentenceIndex);
      rect.setAttribute('x', node.x);
      rect.setAttribute('y', node.y);
      rect.setAttribute('width', node.width);
      rect.setAttribute('height', node.height);
      rect.setAttribute('rx', 3);
      rect.addEventListener('click', function () {
        selectNode(sentenceIndex, node.id);
      });
      rect.addEventListener('pointerdown', function (e) {
        nodeDrag = { sentenceIndex: sentenceIndex, nodeId: node.id, startX: e.clientX, startY: e.clientY, moved: false };
        window.addEventListener('pointermove', onNodeDragMove);
        window.addEventListener('pointerup', onNodeDragEnd);
      });
      svg.appendChild(rect);

      if (isEditing) {
        var headerField = createEditableField(node.x, node.y, node.width, node.headerHeight, node.text, null, function (val, commit) {
          node.text = val;
          if (commit) renderAll();
        });
        svg.appendChild(headerField.fo);
      } else {
        var text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('class', 'word-text');
        text.setAttribute('x', node.x + node.width / 2);
        text.setAttribute('y', node.y + node.headerHeight / 2 + 1);
        text.textContent = node.text;
        svg.appendChild(text);
      }

      if (node.notes && node.notes.length) {
        var divider = document.createElementNS(SVG_NS, 'line');
        divider.setAttribute('class', 'note-divider');
        divider.setAttribute('x1', node.x + 6);
        divider.setAttribute('x2', node.x + node.width - 6);
        divider.setAttribute('y1', node.y + node.headerHeight);
        divider.setAttribute('y2', node.y + node.headerHeight);
        svg.appendChild(divider);

        node.notes.forEach(function (noteText, i) {
          var noteY = node.y + node.headerHeight + i * NOTE_LINE_HEIGHT;
          if (isEditing) {
            var noteField = createEditableField(node.x, noteY, node.width, NOTE_LINE_HEIGHT, noteText, 'note-edit-input', function (val, commit) {
              node.notes[i] = val;
              if (commit) {
                if (val.trim() === '') {
                  node.notes.splice(i, 1);
                }
                renderAll();
              }
            });
            svg.appendChild(noteField.fo);
          } else {
            var noteEl = document.createElementNS(SVG_NS, 'text');
            noteEl.setAttribute('class', 'note-text');
            noteEl.setAttribute('x', node.x + node.width / 2);
            noteEl.setAttribute('y', noteY + NOTE_LINE_HEIGHT / 2 + 3);
            noteEl.textContent = noteText;
            svg.appendChild(noteEl);
          }
        });
      }

      node.children.forEach(function (edge) {
        drawNodeBox(edge.node);
      });
    }

    drawConnectors(root);
    drawNodeBox(root);
    return svg;
  }

  function selectNode(sentenceIndex, nodeId) {
    editingTarget = null;
    groupTitleEdit = null;
    input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
    if (selection.type === 'node' && selection.sentenceIndex === sentenceIndex && selection.nodeId === nodeId) {
      clearSelection();
      return;
    }
    selection.type = 'node';
    selection.sentenceIndex = sentenceIndex;
    selection.nodeId = nodeId;
    selection.parentId = null;
    selection.childId = null;
    selection.groupId = null;
    renderAll();
    input.focus();
  }

  function selectEdge(sentenceIndex, parentId, childId) {
    editingTarget = null;
    groupTitleEdit = null;
    input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
    if (selection.type === 'edge' && selection.sentenceIndex === sentenceIndex &&
      selection.parentId === parentId && selection.childId === childId) {
      clearSelection();
      return;
    }
    selection.type = 'edge';
    selection.sentenceIndex = sentenceIndex;
    selection.parentId = parentId;
    selection.childId = childId;
    selection.nodeId = null;
    selection.groupId = null;
    renderAll();
  }

  function clearSelection() {
    editingTarget = null;
    groupTitleEdit = null;
    input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
    selection.type = null;
    selection.sentenceIndex = null;
    selection.nodeId = null;
    selection.parentId = null;
    selection.childId = null;
    selection.groupId = null;
    renderAll();
  }

  // Вибір/зняття вибору рамки групування (клік по рамці — як для node/edge).
  function selectGroup(sentenceIndex, groupId) {
    editingTarget = null;
    if (selection.type === 'group' && selection.sentenceIndex === sentenceIndex && selection.groupId === groupId) {
      clearSelection();
      return;
    }
    groupTitleEdit = null;
    input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
    selection.type = 'group';
    selection.sentenceIndex = sentenceIndex;
    selection.groupId = groupId;
    selection.nodeId = null;
    selection.parentId = null;
    selection.childId = null;
    renderAll();
  }

  // Чиста функція (без побічних ефектів): визначає, чи є hoverNodeId
  // сиблінгом рамки group, і якщо так — яким має стати новий список
  // nodeIds (або сигнал remove:true, якщо єдиний прямокутник рамки
  // перетягнуто за його центр). Використовується і для живого попереднього
  // перегляду під час руху пальця (onFrameDragMove), і для остаточного
  // застосування зміни при відпусканні (onFrameDragEnd/updateFrameBoundary).
  function computeFrameDragTarget(root, group, handle, hoverNodeId, pastCenter) {
    // Рамка кореня речення (group.parentId === null) не має справжніх
    // сиблінгів — корінь завжди єдиний, тож список «сусідів» тут віртуальний
    // з одним елементом: розширити рамку нікуди, але «витягнути» корінь із
    // рамки перетягуванням маркера за центр (див. нижче) усе одно можливо.
    var siblings;
    if (group.parentId === null) {
      siblings = [{ node: root }];
    } else {
      var parent = findNode(root, group.parentId);
      if (!parent) return null;
      siblings = parent.children;
    }

    var hoverIdx = -1;
    for (var i = 0; i < siblings.length; i++) {
      if (siblings[i].node.id === hoverNodeId) { hoverIdx = i; break; }
    }
    if (hoverIdx === -1) return null; // не сиблінг цього батька — ігноруємо

    // Прямокутник, доданий «до рамки» ІНШОЇ групи (edge.frameGroupId вказує
    // на чужий groupId), — це не звичайний сиблінг, а зовнішній додаток
    // чужої рамки, примусово розташований власною логікою тієї рамки. Його
    // не можна захоплювати межею цієї рамки: інакше він одночасно вважався
    // б «членом» двох різних рамок і «стрибав» би між позиціями, які для
    // нього рахують дві незалежні, суперечливі одна одній частини коду.
    if (siblings[hoverIdx].frameGroupId && siblings[hoverIdx].frameGroupId !== group.id) return null;

    var currentIdx = [];
    siblings.forEach(function (edge, idx) {
      if (group.nodeIds.indexOf(edge.node.id) !== -1) currentIdx.push(idx);
    });
    if (!currentIdx.length) return null;
    var minIdx = Math.min.apply(null, currentIdx);
    var maxIdx = Math.max.apply(null, currentIdx);

    // Єдиний прямокутник лишився в рамці, і маркер перетягнуто за його
    // центр — сигнал прибрати рамку повністю, щоб цей останній прямокутник
    // міг «вийти» з рамки (звузити рамку нижче 1 елемента інакше неможливо).
    if (minIdx === maxIdx && hoverIdx === minIdx && pastCenter) {
      return { remove: true, siblings: siblings };
    }

    var newMin = minIdx, newMax = maxIdx;
    if (handle === 'top') {
      newMin = Math.min(hoverIdx, maxIdx);
    } else {
      newMax = Math.max(hoverIdx, minIdx);
    }

    // Якщо в отриманому діапазоні опиняється прямокутник, доданий «до
    // рамки» іншої групи (навіть якщо сам hoverNodeId — легітимний, але
    // діапазон між ним і поточною межею «перестрибує» через чужий додаток),
    // обрізаємо діапазон одразу перед таким прямокутником у відповідному
    // напрямку — щоб він так само ніколи не потрапив у цю рамку.
    for (var k = newMin; k <= newMax; k++) {
      var fgid = siblings[k].frameGroupId;
      if (fgid && fgid !== group.id) {
        if (handle === 'top') { newMin = k + 1; } else { newMax = k - 1; }
        break;
      }
    }
    if (newMin > newMax) return null;

    var newIds = [];
    for (var j = newMin; j <= newMax; j++) newIds.push(siblings[j].node.id);
    return { newIds: newIds, siblings: siblings };
  }

  // Перетягування маркера рамки (верх/низ): під час руху пальця/курсора НЕ
  // викликає renderAll() (це знищувало б DOM-елемент, захоплений пальцем, і
  // зривало жест pointercancel'ом на дотикових пристроях) — замість цього
  // напряму оновлює геометрію самої рамки (живий попередній перегляд) і
  // підсвічує прямокутник, який буде захоплено в рамку. Фактична зміна межі
  // застосовується лише в onFrameDragEnd, коли жест завершено.
  // Примусово блокує нативну прокрутку сторінки/канви на нативній події
  // touchmove, поки триває перетягування маркера рамки (frameDrag активний).
  // Слухач ОБОВ'ЯЗКОВО не passive — інакше preventDefault() ігнорується
  // браузером і прокрутка все одно почнеться.
  function blockScrollDuringFrameDrag(e) {
    if (!frameDrag) return;
    if (e.cancelable) e.preventDefault();
  }

  function onFrameDragMove(e) {
    if (!frameDrag) return;
    console.log('[frame-drag] pointermove', e.clientX, e.clientY);
    // На планшетах/телефонах без preventDefault браузер під час перетягування
    // може перехопити жест як прокрутку сторінки (навіть при touch-action:none
    // на самому маркері) — через це розширення рамки дотиком не спрацьовувало.
    if (e.cancelable) e.preventDefault();
    try {
      // document.elementsFromPoint підтримується не в усіх мобільних
      // браузерах/WebView — якщо його немає, це раніше кидало виняток на
      // КОЖНОМУ русі пальця одразу після pointerdown (контур встигав
      // почервоніти, а далі нічого не відбувалося, бо виняток обривав усю
      // подальшу обробку жесту). Тепер є резервний варіант через
      // elementFromPoint.
      var stack = typeof document.elementsFromPoint === 'function'
        ? document.elementsFromPoint(e.clientX, e.clientY)
        : [document.elementFromPoint(e.clientX, e.clientY)].filter(Boolean);
      var boxEl = null;
      for (var si = 0; si < stack.length; si++) {
        var candidate = stack[si].closest('[data-node-id]');
        if (candidate) { boxEl = candidate; break; }
      }
      if (!boxEl) return;
      var hoverNodeId = parseInt(boxEl.getAttribute('data-node-id'), 10);
      var boxRect = boxEl.getBoundingClientRect();
      // Якщо курсор перетягнутого маркера пройшов ЗА центр прямокутника, над
      // яким він зараз перебуває (top — нижче центру, bottom — вище центру),
      // це сигнал «прибрати цей прямокутник із рамки» — навіть якщо він єдиний,
      // хто лишився в групі (інакше останній прямокутник ніколи не можна було б
      // вивести з рамки перетягуванням: звузити рамку нижче 1 елемента раніше
      // було неможливо).
      var pastCenter = frameDrag.handle === 'top'
        ? e.clientY > boxRect.top + boxRect.height / 2
        : e.clientY < boxRect.top + boxRect.height / 2;

      var target = computeFrameDragTarget(frameDrag.root, frameDrag.group, frameDrag.handle, hoverNodeId, pastCenter);

      // Підсвітка прямокутника, над яким зараз палець/курсор, — лише якщо він
      // є дійсним сиблінгом рамки (валідна ціль).
      if (frameDrag.hoverEl && frameDrag.hoverEl !== boxEl) {
        frameDrag.hoverEl.classList.remove('frame-target');
        frameDrag.hoverEl = null;
      }
      if (target && boxEl) {
        boxEl.classList.add('frame-target');
        frameDrag.hoverEl = boxEl;
      }

      frameDrag.hoverNodeId = hoverNodeId;
      frameDrag.pastCenter = pastCenter;

      if (!target) return;

      if (target.remove) {
        // Живий попередній перегляд «видалення» рамки — притлумлюємо контур,
        // остаточне видалення групи станеться при відпусканні маркера.
        frameDrag.pendingRemove = true;
        frameDrag.frameRectEl.classList.add('removing');
        return;
      }

      frameDrag.pendingRemove = false;
      frameDrag.frameRectEl.classList.remove('removing');

      // Живе (без renderAll) оновлення геометрії рамки під нові межі — та сама
      // формула базового прямокутника рамки, що й в остаточному рендері
      // (без урахування розсування вкладених рамок — воно застосується коректно
      // вже після renderAll() при відпусканні маркера).
      var newGb = computeGroupMemberBounds(frameDrag.root, { nodeIds: target.newIds });
      if (!newGb) return;
      var baseRect = computeBaseFrameRect(newGb, frameDrag.meta);
      if (!baseRect) return;
      frameDrag.frameRectEl.setAttribute('x', baseRect.x);
      frameDrag.frameRectEl.setAttribute('y', baseRect.y);
      frameDrag.frameRectEl.setAttribute('width', baseRect.width);
      frameDrag.frameRectEl.setAttribute('y', baseRect.y);
      frameDrag.frameRectEl.setAttribute('width', baseRect.width);
      frameDrag.frameRectEl.setAttribute('height', baseRect.height);
      if (frameDrag.frameHitEl) {
        frameDrag.frameHitEl.setAttribute('x', baseRect.x);
        frameDrag.frameHitEl.setAttribute('y', baseRect.y);
        frameDrag.frameHitEl.setAttribute('width', baseRect.width);
        frameDrag.frameHitEl.setAttribute('height', baseRect.height);
      }
    } catch (err) {
      console.error('onFrameDragMove:', err);
    }
  }

  function onFrameDragEnd() {
    if (!frameDrag) return;
    console.log('[frame-drag] pointerup');
    var drag = frameDrag;
    frameDrag = null;
    window.removeEventListener('pointermove', onFrameDragMove);
    window.removeEventListener('pointerup', onFrameDragEnd);
    window.removeEventListener('pointercancel', onFrameDragCancel);
    window.removeEventListener('touchmove', blockScrollDuringFrameDrag);
    if (drag.hoverEl) drag.hoverEl.classList.remove('frame-target');
    if (drag.frameRectEl) { drag.frameRectEl.classList.remove('dragging'); drag.frameRectEl.classList.remove('removing'); }
    if (drag.frameHitEl) drag.frameHitEl.classList.remove('dragging');
    if (drag.hoverNodeId != null) {
      updateFrameBoundary(drag.sentenceIndex, drag.groupId, drag.handle, drag.hoverNodeId, drag.pastCenter);
    }
  }

  function onFrameDragCancel(e) {
    if (!frameDrag) return;
    console.log('[frame-drag] pointercancel — браузер перервав жест, зміну межі рамки скасовано');
    var drag = frameDrag;
    frameDrag = null;
    window.removeEventListener('pointermove', onFrameDragMove);
    window.removeEventListener('pointerup', onFrameDragEnd);
    window.removeEventListener('pointercancel', onFrameDragCancel);
    window.removeEventListener('touchmove', blockScrollDuringFrameDrag);
    if (drag.hoverEl) drag.hoverEl.classList.remove('frame-target');
    if (drag.frameRectEl) { drag.frameRectEl.classList.remove('dragging'); drag.frameRectEl.classList.remove('removing'); }
    if (drag.frameHitEl) drag.frameHitEl.classList.remove('dragging');
    // На відміну від onFrameDragEnd — зміну межі НЕ застосовуємо: pointercancel
    // означає, що жест перервано (не завершено користувачем свідомо), тож
    // рамка повертається до стану до початку перетягування (без renderAll()
    // геометрія рамки/хіта поверталась би сама, але про всяк випадок
    // перемальовуємо, щоб гарантовано скинути живий попередній перегляд).
    renderAll();
  }

  function updateFrameBoundary(sentenceIndex, groupId, handle, hoverNodeId, pastCenter) {
    var sentence = STORAGE.sentences[sentenceIndex];
    if (!sentence) return;
    var group = (sentence.groups || []).filter(function (g) { return g.id === groupId; })[0];
    if (!group) return;

    var target = computeFrameDragTarget(sentence.root, group, handle, hoverNodeId, pastCenter);
    if (!target) return;

    if (target.remove) {
      sentence.groups = (sentence.groups || []).filter(function (g) { return g.id !== groupId; });
      if (selection.type === 'group' && selection.sentenceIndex === sentenceIndex && selection.groupId === groupId) {
        clearSelection();
      } else {
        renderAll();
      }
      return;
    }

    var newIds = target.newIds;
    if (newIds.length === group.nodeIds.length && newIds.every(function (id, idx) { return id === group.nodeIds[idx]; })) return;
    group.nodeIds = newIds;
    renderAll();
  }

  // Перетягування прямокутника на інший прямокутник: створює новий зв'язок,
  // переприв'язуючи вузол (разом з його дочірніми прямокутниками) до нової цілі.
  function onNodeDragMove(e) {
    if (!nodeDrag) return;
    var dx = e.clientX - nodeDrag.startX;
    var dy = e.clientY - nodeDrag.startY;
    if (!nodeDrag.moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
      nodeDrag.moved = true;
    }
    if (!nodeDrag.moved) return;

    var prevTarget = list.querySelector('.word-box.drop-target');
    if (prevTarget) prevTarget.classList.remove('drop-target');

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var boxEl = el ? el.closest('[data-node-id]') : null;
    if (boxEl) {
      var hoverId = parseInt(boxEl.getAttribute('data-node-id'), 10);
      if (hoverId !== nodeDrag.nodeId) boxEl.classList.add('drop-target');
    }
  }

  function onNodeDragEnd(e) {
    if (!nodeDrag) return;
    var dragInfo = nodeDrag;
    nodeDrag = null;
    window.removeEventListener('pointermove', onNodeDragMove);
    window.removeEventListener('pointerup', onNodeDragEnd);

    var prevTarget = list.querySelector('.word-box.drop-target');
    if (prevTarget) prevTarget.classList.remove('drop-target');

    if (!dragInfo.moved) return; // звичайний клік вже опрацьовано окремим 'click'

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var boxEl = el ? el.closest('[data-node-id]') : null;
    if (!boxEl) return;
    var targetNodeId = parseInt(boxEl.getAttribute('data-node-id'), 10);
    var targetSentenceIndex = parseInt(boxEl.getAttribute('data-sentence-index'), 10);
    reparentNode(dragInfo.sentenceIndex, dragInfo.nodeId, targetSentenceIndex, targetNodeId);
  }

  function reparentNode(sentenceIndex, draggedNodeId, targetSentenceIndex, targetNodeId) {
    if (sentenceIndex === targetSentenceIndex && draggedNodeId === targetNodeId) return;
    var sentence = STORAGE.sentences[sentenceIndex];
    var targetSentence = STORAGE.sentences[targetSentenceIndex];
    if (!sentence || !targetSentence) return;

    // Кореневий прямокутник не можна зробити дочірнім вузлом у межах свого ж
    // речення (речення завжди має рівно один корінь), але перетягування
    // кореня на прямокутник ІНШОГО графічного речення тепер приєднує ЦІЛЕ
    // речення (усю кореневу гілку разом з усіма дочірніми прямокутниками й
    // рамками) як дочірню гілку цього прямокутника — два речення стають
    // одним, а не просто міняються місцями в списку.
    if (sentence.root.id === draggedNodeId) {
      if (sentenceIndex === targetSentenceIndex) return; // усередині свого ж речення приєднувати нікуди
      var targetRootNode = findNode(targetSentence.root, targetNodeId);
      if (!targetRootNode) return;
      var rootNode = sentence.root;
      targetRootNode.children.push({ node: rootNode, lineType: currentLineType });
      // Рамки колишнього речення й далі посилаються на ті самі id вузлів —
      // переносимо їх у список рамок цільового речення, тепер уже спільного дерева.
      if (sentence.groups && sentence.groups.length) {
        targetSentence.groups = (targetSentence.groups || []).concat(sentence.groups);
      }
      STORAGE.sentences.splice(sentenceIndex, 1);
      var newTargetIndex = targetSentenceIndex > sentenceIndex ? targetSentenceIndex - 1 : targetSentenceIndex;
      selection.type = 'node';
      selection.sentenceIndex = newTargetIndex;
      selection.nodeId = rootNode.id;
      renderAll();
      return;
    }

    var draggedNode = findNode(sentence.root, draggedNodeId);
    var targetNode = findNode(targetSentence.root, targetNodeId);
    if (!draggedNode || !targetNode) return;

    // Заборона перепідключення вузла до самого себе чи до власного нащадка
    // (лише в межах того самого речення — у різних реченнях дерева окремі,
    // тому цикл неможливий у принципі).
    if (sentenceIndex === targetSentenceIndex) {
      var subtreeIds = collectSubtreeIds(draggedNode);
      if (subtreeIds.indexOf(targetNodeId) !== -1) return; // не можна в свого ж нащадка
    }

    var parentInfo = findParent(sentence.root, draggedNodeId);
    if (!parentInfo) return;
    var edge = parentInfo.parent.children[parentInfo.index];
    var oldParentId = parentInfo.parent.id;
    parentInfo.parent.children.splice(parentInfo.index, 1);
    edge.lineType = currentLineType;
    targetNode.children.push(edge);

    // Вузол, що переїхав до нового батька, більше не сиблінг у старій рамці —
    // прибираємо його звідти; порожні рамки видаляємо.
    sentence.groups = (sentence.groups || []).map(function (g) {
      if (g.parentId === oldParentId) {
        g.nodeIds = g.nodeIds.filter(function (id) { return id !== draggedNodeId; });
      }
      return g;
    }).filter(function (g) { return g.nodeIds.length > 0; });

    renderAll();
  }

  // Перевіряє, чи вибраний прямокутник можна групувати в рамку. Раніше
  // корінь речення виключався (бо не має братів/сестер), але тепер рамку
  // можна застосувати і до кореня — така рамка просто не має куди
  // розширюватись (сиблінгів у кореня немає), але сама можливість є.
  function canGroupSelectedNode() {
    if (selection.type !== 'node') return false;
